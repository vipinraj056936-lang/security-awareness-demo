  <h2>Phishing Awareness Demo</h2>
  <p>ഇത് ബോധവൽക്കരണത്തിനുള്ള പരിശീലന പേജാണ്.</p>
  <p>അപരിചിതമായ ലിങ്കുകളിൽ പാസ്‌വേഡ് നൽകരുത്.</p>
  <p>വെബ് വിലാസം ശ്രദ്ധിച്ച് പരിശോധിക്കുക.</p>
  <p>യഥാർത്ഥ അക്കൗണ്ട് വിവരങ്ങൾ ഇവിടെ നൽകരുത്.</p>
